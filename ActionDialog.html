<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --primary: #00205b;
            --primary-hover: #00133a;
            --success: #059669;
            --warning: #d97706;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --ow-gold: #d4af37;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 15px;
            font-size: 0.85rem;
        }

        .info-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 15px;
        }

        .status-badge {
            display: inline-block;
            background-color: rgba(212, 175, 55, 0.15);
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-top: 5px;
            border: 1px solid rgba(212, 175, 55, 0.4);
        }

        .form-group {
            margin-bottom: 10px;
        }

        label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 3px;
            font-weight: 600;
            display: block;
        }

        input,
        select {
            width: 100%;
            box-sizing: border-box;
            background-color: #fafafa;
            border: 1px solid var(--border);
            padding: 6px 10px;
            border-radius: 4px;
            font-family: 'Outfit', sans-serif;
        }

        input:focus {
            outline: none;
            border-color: var(--ow-gold);
            box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.2);
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
            transform: scale(1.02);
        }

        .btn.success {
            background-color: var(--success);
        }

        .btn.success:hover {
            background-color: #047857;
        }

        .btn.secondary {
            background-color: var(--text-muted);
        }

        details {
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 10px;
            background-color: white;
            overflow: hidden;
        }

        summary {
            font-weight: 700;
            cursor: pointer;
            padding: 10px;
            background-color: #f1f5f9;
            color: var(--primary);
            font-size: 0.8rem;
        }

        .details-content {
            padding: 12px;
        }

        .loader {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #error-msg {
            color: #ef4444;
            font-size: 0.8rem;
            text-align: center;
            margin-top: 10px;
        }

        .flex-row {
            display: flex;
            gap: 10px;
        }

        .flex-row>div {
            flex: 1;
        }

        /* Edit Override UI */
        body.edit-mode .form-group {
            display: block !important;
        }

        body.edit-mode .flex-row {
            display: flex !important;
        }

        body.edit-mode details {
            display: block !important;
        }
    </style>
</head>

<body>
    <!-- CONTEXTUAL ENGINE -->
    <div id="top-card" class="info-card"
        style="border-left: 4px solid var(--primary); display: flex; flex-direction: column;">
        <div style="margin-bottom: 5px; display: flex; gap: 8px; align-items: center;">
            <input type="text" id="action-search-input" placeholder="Search PR No or PO No..."
                style="flex:1; padding: 8px; border-color: var(--primary);">
            <button class="btn" style="width: auto; white-space: nowrap; padding: 9px 15px;"
                onclick="executeActionSearch()">🔍 Search</button>
            <button class="btn success"
                style="width: auto; white-space: nowrap; padding: 9px 15px; background-color: var(--success);"
                onclick="createNewOrder()">✨ New</button>
        </div>

        <!-- Search Results Dropdown-like display -->
        <div id="action-search-results"
            style="display: none; margin-top: 10px; max-height: 180px; overflow-y: auto; border: 1px solid var(--border); border-radius: 4px; padding: 5px; gap: 5px; flex-direction: column; background: #f8fafc;">
        </div>

        <div id="ctx-header"
            style="display: none; justify-content: space-between; align-items: flex-start; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);">
            <div>
                <div id="ctx-po" style="font-weight: 700; font-size: 1rem; color: var(--primary);"></div>
                <div id="ctx-supplier" style="font-size: 0.80rem; font-weight: 600; margin-top: 2px;"></div>
                <div id="ctx-sub" style="font-size: 0.70rem; color: var(--text-muted); margin-top: 2px;"></div>
                <div id="ctx-state" class="status-badge" style="margin-top: 6px;"></div>
            </div>
            <div style="text-align: right;">
                <label
                    style="font-size: 0.7rem; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; gap: 4px; background: #f8fafc; padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border);">
                    <input type="checkbox" id="edit-mode-toggle"
                        onchange="document.body.classList.toggle('edit-mode', this.checked)">
                    ✏️ Edit All
                </label>
            </div>
        </div>
    </div>

    <div class="loader" id="loader"></div>
    <div id="error-msg"></div>

    <div id="completed-msg"
        style="display: none; text-align: center; padding: 30px; color: var(--success); font-weight: bold;">✅ This order
        is Completed. No further actions required.</div>

    <div id="app-body" style="display: none;">

        <div class="info-card"
            style="border: 2px solid var(--warning); background-color: #fffbeb; padding: 12px; margin-bottom: 15px;">
            <div style="font-size: 0.9rem; font-weight: bold; color: var(--warning); margin-bottom: 8px;">⏱️ Critical
                Date Updater</div>
            <div class="flex-row" style="align-items: flex-end; gap: 8px;">
                <div class="form-group" style="margin: 0; flex: 1;">
                    <label style="color: #b45309; font-weight: bold;">ETD (Target/Actual)</label>
                    <input type="date" id="v-urgent-etd" onclick="this.showPicker()"
                        onchange="syncBinding('v-etd', this.value)" style="border: 1px solid var(--warning);">
                </div>
                <div class="form-group" style="margin: 0; flex: 1;">
                    <label style="color: #b45309; font-weight: bold;">ETA (Vessel Arrival)</label>
                    <input type="date" id="v-urgent-eta" onclick="this.showPicker()"
                        onchange="syncBinding('v-eta', this.value)" style="border: 1px solid var(--warning);">
                </div>
                <button class="btn" style="flex: 0.5; background-color: var(--warning); color: white; padding: 8px;"
                    onclick="submitData(false)">🔄 Update</button>
            </div>
        </div>

        <details id="det-req">
            <summary>📋 Phase 0: Initiated Order (Pre-PO)</summary>
            <div class="details-content">
                <div class="flex-row">
                    <div class="form-group"><label>Company</label><input type="text" id="v-company"></div>
                    <div class="form-group"><label>PR Number</label><input type="text" id="v-prNo"></div>
                </div>
                <div class="flex-row">
                    <div class="form-group"><label>PR Date</label><input type="date" id="v-prDate"
                            onclick="this.showPicker()"></div>
                    <div class="form-group"><label>Item Description</label><input type="text" id="v-desc"></div>
                </div>
                <div class="flex-row">
                    <div class="form-group"><label>Quantity (TO)</label><input type="number" id="v-qty"></div>
                    <div class="form-group"><label>Req. Del. Date</label><input type="date" id="v-reqDelDate"
                            onclick="this.showPicker()"></div>
                </div>
                <div class="flex-row">
                    <div class="form-group"><label>Buyer Email</label><input type="email" id="v-buyerEmail"></div>
                    <div class="form-group" style="display:none;"></div>
                </div>
            </div>
        </details>

        <details id="det-prod">
            <summary>📦 Phase 1: Production & Core Data</summary>
            <div class="details-content">
                <div class="flex-row">
                    <div class="form-group"><label>Supplier</label><input type="text" id="v-supplier"></div>
                    <div class="form-group"><label>Vendor Email</label><input type="email" id="v-vendorEmail"></div>
                </div>
                <div class="flex-row">
                    <div class="form-group"><label>PO Number</label><input type="text" id="v-poNo"></div>
                    <div class="form-group"><label>PO Issuance Date</label><input type="date" id="v-poIssDate"
                            onclick="this.showPicker()"></div>
                </div>
                <div class="flex-row">
                    <div class="form-group"><label>PO Appr Date</label><input type="date" id="v-poApprDate"
                            onclick="this.showPicker()"></div>
                    <div class="form-group"><label>Target Lead Time (Days)</label><input type="number" id="v-leadTime">
                    </div>
                </div>
                <div class="flex-row">
                    <div class="form-group"><label>Incoterm / Del. Term</label><select id="v-delTerm">
                            <option value="">-- Select --</option>
                        </select></div>
                    <div class="form-group"><label>PI Number</label><input type="text" id="v-piNo"></div>
                </div>
                <div class="flex-row">
                    <div class="form-group"><label>Est Readiness Date</label><input type="date" id="v-estReadiness"
                            onclick="this.showPicker()"></div>
                    <div class="form-group" style="display:none;"></div>
                </div>
            </div>
        </details>

        <details id="det-transit">
            <summary>🚢 Phase 2: Pre-Transit / Shipping Docs</summary>
            <div class="details-content">
                <div class="flex-row">
                    <div class="form-group"><label>Bank Name</label><select id="v-bank">
                            <option value="">-- Select --</option>
                        </select></div>
                    <div class="form-group"><label>Bank/Payment Date</label><input type="date" id="v-bankDate"
                            onclick="this.showPicker()"></div>
                </div>
                <div class="flex-row">
                    <div class="form-group"><label>Containers (No.)</label><input type="number" id="v-containers"></div>
                    <div class="form-group"><label>Container Type</label><input type="text" id="v-containerType"></div>
                </div>
                <div class="flex-row">
                    <div class="form-group"><label>ETD (Actual)</label><input type="date" id="v-etd"
                            onchange="syncBinding('v-urgent-etd', this.value)" onclick="this.showPicker()"></div>
                    <div class="form-group"><label>ETA</label><input type="date" id="v-eta"
                            onchange="syncBinding('v-urgent-eta', this.value)" onclick="this.showPicker()"></div>
                </div>
                <div class="flex-row">
                    <div class="form-group"><label>BL Number</label><input type="text" id="v-blNo"></div>
                    <div class="form-group"><label>ACID Number</label><input type="text" id="v-acid"></div>
                </div>
                <div class="flex-row">
                    <div class="form-group"><label>Value</label><input type="number" id="v-value"></div>
                    <div class="form-group"><label>Currency</label><select id="v-currency">
                            <option value="">-- Select --</option>
                        </select></div>
                </div>
                <div class="flex-row">
                    <div class="form-group"><label>Payment Term</label><select id="v-payTerm">
                            <option value="">-- Select --</option>
                        </select></div>
                    <div class="form-group"><label>Comm Invoice Number</label><input type="text" id="v-commInv"></div>
                </div>
                <div class="flex-row">
                    <div class="form-group"><label>FOB Price (Optional)</label><input type="number" id="v-fob"></div>
                    <div class="form-group"><label>CIF Price (Optional)</label><input type="number" id="v-cif"></div>
                </div>
            </div>
        </details>

        <details id="det-clearance">
            <summary>🛃 Phase 3: Port & Customs Clearance</summary>
            <div class="details-content">
                <div class="form-group"><label>Doc Arrival at Port</label><input type="date" id="v-docArrival"
                        onclick="this.showPicker()"></div>
                <div class="form-group"><label>Shipment Release Date</label><input type="date" id="v-shipRelease"
                        onclick="this.showPicker()"></div>
            </div>
        </details>

        <div class="form-group" style="margin-top:10px;">
            <label>Internal Comments / Notes</label>
            <input type="text" id="v-comments">
        </div>

        <div class="flex-row" style="margin-top: 15px;">
            <button class="btn secondary" onclick="submitData(false)">💾 Save Fields Temporarily</button>
            <button class="btn success" id="btn-advance" onclick="handleAdvanceClick()">🚀 Advance Phase</button>
        </div>
        <button class="btn" style="background-color: #ef4444; color: white; width: 100%; margin-top: 10px;"
            onclick="archiveOrder()">🗑️ Terminate / Archive Order</button>
    </div>

    <script>
        // Note: Update READ_FLOW_URL below once you have it from Power Automate
        const READ_FLOW_URL = "https://default026147d2bad14ffe8ae1ec20d190d9.2a.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/29/workflows/a2f1fcee95724175b175c517dda13c9b/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=ZBcHG8Il6kHl_BLGacbnHJ5huisv9oA0yOQkJTrT6o4";
        const WRITE_FLOW_URL = "https://default026147d2bad14ffe8ae1ec20d190d9.2a.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/27/workflows/878fcfc39ead4cd7b6d296fbecba2c6b/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=c_0sC3KjVtLEqkvIE-7hD_ELvDvybhpMWyB1cnLJ7tM";

        let currentRow = -1;
        let currentState = "Initiated Order";
        let currentPoNo = "";

        let trackerCache = [];

        window.addEventListener('DOMContentLoaded', () => {
            fetchTrackerData();
        });

        async function fetchTrackerData() {
            document.getElementById('loader').style.display = 'block';
            try {
                const res = await fetch(READ_FLOW_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: "readAll" })
                });

                if (!res.ok) throw new Error("Failed to fetch data from Power Automate Endpoint");

                const responseData = await res.json();
                trackerCache = Array.isArray(responseData) ? responseData : (responseData.value || responseData.rows || []);


            } catch (error) {
                onError(error);
            }
            document.getElementById('loader').style.display = 'none';
        }

        function executeActionSearch() {
            const query = document.getElementById('action-search-input').value.toLowerCase().trim();
            const resultsDiv = document.getElementById('action-search-results');

            if (!query) {
                resultsDiv.style.display = 'none';
                return;
            }

            resultsDiv.innerHTML = '';
            let matches = 0;

            for (let i = 1; i < trackerCache.length; i++) {
                let row = trackerCache[i];
                let pr = String(row[1] || "").toLowerCase();
                let po = String(row[8] || "").toLowerCase();
                let state = String(row[32] || "Initiated Order");

                if (state !== "Closed" && state !== "Archived") {
                    if (pr.includes(query) || po.includes(query)) {
                        matches++;
                        let btn = document.createElement('div');
                        btn.style = "padding: 8px; border: 1px solid #e2e8f0; border-radius: 4px; cursor: pointer; font-size: 0.8rem; background: #fff;";
                        btn.innerHTML = `<div style="font-weight:bold; color:var(--primary);">${row[8] || "No PO"} | ${row[1] || "No PR"}</div><div style="font-size:0.7rem; color:#64748b; margin-top:3px;">${row[5] || "Unknown Supplier"} - <span style="color:var(--text); font-weight:bold; text-transform:uppercase;">${state}</span></div>`;

                        // Over hover effect inline
                        btn.onmouseover = () => btn.style.backgroundColor = '#f1f5f9';
                        btn.onmouseout = () => btn.style.backgroundColor = '#fff';

                        btn.onclick = () => {
                            resultsDiv.style.display = 'none';
                            processRowSelection(i + 1, row);
                        };
                        resultsDiv.appendChild(btn);
                    }
                }
            }

            if (matches === 0) {
                resultsDiv.innerHTML = '<div style="font-size: 0.8rem; color: #ef4444; padding: 5px;">No matching orders found.</div>';
            }

            resultsDiv.style.display = 'flex';
        }

        function createNewOrder() {
            document.getElementById('action-search-results').style.display = 'none';
            document.getElementById('action-search-input').value = "";
            currentPoNo = "";

            let emptyData = new Array(36).fill("");
            processRowSelection(-1, emptyData);
        }

        function processRowSelection(rowIdx, selectedRow) {
            document.getElementById('action-search-input').value = String(selectedRow[8] || selectedRow[1] || "");

            const formatIfDate = (val) => {
                if (typeof val === 'number') {
                    const d = new Date(Math.round((val - 25569) * 86400 * 1000));
                    return d.toISOString().split('T')[0];
                }
                return val ? String(val) : "";
            };

            const data = selectedRow;
            currentPoNo = String(data[8] || "");

            let ctx = {
                row: rowIdx,
                state: data[32] || "Initiated Order",
                prNo: data[1],
                poNo: currentPoNo,
                supplier: data[5],
                blNo: data[27],
                piNo: data[6],
                delTerm: data[15],
                colorConfig: getStateColorConfig(data[32] || "Initiated Order"),
                rawObj: {
                    company: formatIfDate(data[0]),
                    prNo: formatIfDate(data[1]),
                    prDate: formatIfDate(data[2]),
                    desc: formatIfDate(data[3]),
                    qty: formatIfDate(data[4]),
                    supplier: formatIfDate(data[5]),
                    piNo: formatIfDate(data[6]),
                    commInv: formatIfDate(data[7]),
                    poNo: formatIfDate(data[8]),
                    poIssDate: formatIfDate(data[9]),
                    fob: formatIfDate(data[10]),
                    cif: formatIfDate(data[11]),
                    value: formatIfDate(data[12]),
                    currency: formatIfDate(data[13]),
                    payTerm: formatIfDate(data[14]),
                    delTerm: formatIfDate(data[15]),
                    poApprDate: formatIfDate(data[16]),
                    bank: formatIfDate(data[17]),
                    bankDate: formatIfDate(data[18]),
                    estReadiness: formatIfDate(data[19]),
                    reqDelDate: formatIfDate(data[21]),
                    containers: formatIfDate(data[23]),
                    containerType: formatIfDate(data[24]),
                    etd: formatIfDate(data[25]),
                    eta: formatIfDate(data[26]),
                    blNo: formatIfDate(data[27]),
                    acid: formatIfDate(data[28]),
                    docArrival: formatIfDate(data[29]),
                    shipRelease: formatIfDate(data[30]),
                    comments: formatIfDate(data[31]),
                    vendorEmail: formatIfDate(data[33]),
                    buyerEmail: formatIfDate(data[34]),
                    leadTime: formatIfDate(data[35])
                }
            };

            document.getElementById('ctx-header').style.display = 'flex';
            renderContext(ctx);
        }

        function getStateColorConfig(state) {
            if (state === "In Transit") return { bg: '#d0e3ff', border: '#3b82f6', text: '#1e3a8a' };
            if (state === "Under Clearance") return { bg: '#fef7e0', border: '#f59e0b', text: '#78350f' };
            if (state === "Completed") return { bg: '#bdf4cb', border: '#10b981', text: '#064e3b' };
            if (state === "Initiated Order") return { bg: '#f3e8ff', border: '#8b5cf6', text: '#4c1d95' };
            if (state === "Archived") return { bg: '#f1f5f9', border: '#94a3b8', text: '#475569' };
            return { bg: '#ffffff', border: '#fbbf24', text: '#92400e' };
        }

        function renderContext(ctx) {
            if (ctx.error) {
                document.getElementById('error-msg').innerText = ctx.error;
                document.getElementById('app-body').style.display = 'none';
                return;
            }
            document.getElementById('error-msg').innerText = '';

            const safeState = ctx.state ? String(ctx.state).trim() : "";
            let isRowChange = false;

            if (currentRow !== ctx.row) {
                isRowChange = true;
                document.querySelectorAll('.dirty-input').forEach(el => el.classList.remove('dirty-input'));
            }

            currentRow = ctx.row;
            currentState = safeState;
            let rowDisplay = (ctx.row === -1) ? "New Record" : `Row ${ctx.row}`;
            document.getElementById('ctx-po').innerText = `${rowDisplay} | ${ctx.prNo || 'No PR'} | ${ctx.poNo || 'No PO'}`;
            document.getElementById('ctx-supplier').innerText = ctx.supplier || 'Vendor pending';

            let subText = [];
            if (ctx.piNo) subText.push("PI: " + ctx.piNo);
            if (ctx.blNo) subText.push("BL: " + ctx.blNo);
            if (ctx.delTerm) subText.push("Term: " + ctx.delTerm);
            document.getElementById('ctx-sub').innerText = subText.join(" | ");

            let stateEl = document.getElementById('ctx-state');
            stateEl.innerText = safeState;
            if (ctx.colorConfig) {
                stateEl.style.backgroundColor = ctx.colorConfig.bg;
                stateEl.style.color = ctx.colorConfig.text;
                stateEl.style.borderColor = ctx.colorConfig.border;

                let card = document.getElementById('top-card');
                card.style.borderLeftColor = ctx.colorConfig.border;
                card.style.background = `linear-gradient(to right, ${ctx.colorConfig.bg}, #ffffff 20%)`;
            }

            if (safeState === "Completed") {
                document.getElementById('app-body').style.display = 'none';
                let msg = document.getElementById('completed-msg');
                msg.style.display = 'block';
                msg.innerHTML = "✅ This order is Completed. No further actions required.";
                msg.style.color = "var(--success)";
                return;
            } else if (safeState === "Archived") {
                document.getElementById('app-body').style.display = 'none';
                let msg = document.getElementById('completed-msg');
                msg.style.display = 'block';
                msg.innerHTML = "🗑️ This order has been Cancelled / Archived.";
                msg.style.color = "var(--text-muted)";
                return;
            }

            document.getElementById('completed-msg').style.display = 'none';
            document.getElementById('app-body').style.display = 'block';
            try {
                if (ctx.rawObj) hydrateInputs(ctx.rawObj, isRowChange);
                enforcePhaseIsolation(safeState, isRowChange);
                configureAdvanceButton(safeState);
            } catch (err) {
                document.getElementById('error-msg').innerText = "UI Rendering Error: " + err.message;
            }
        }

        document.addEventListener('input', function (e) {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') {
                e.target.classList.add('dirty-input');
            }
        });

        function hydrateInputs(data, forceWipe) {
            const map = {
                'v-company': 'company', 'v-prNo': 'prNo', 'v-prDate': 'prDate', 'v-desc': 'desc',
                'v-qty': 'qty', 'v-supplier': 'supplier', 'v-vendorEmail': 'vendorEmail', 'v-buyerEmail': 'buyerEmail',
                'v-poNo': 'poNo', 'v-poIssDate': 'poIssDate', 'v-poApprDate': 'poApprDate', 'v-leadTime': 'leadTime',
                'v-value': 'value', 'v-currency': 'currency', 'v-payTerm': 'payTerm', 'v-delTerm': 'delTerm',
                'v-reqDelDate': 'reqDelDate', 'v-piNo': 'piNo', 'v-estReadiness': 'estReadiness',
                'v-bank': 'bank', 'v-bankDate': 'bankDate', 'v-containers': 'containers',
                'v-containerType': 'containerType', 'v-etd': 'etd', 'v-urgent-etd': 'etd', 'v-blNo': 'blNo', 'v-acid': 'acid',
                'v-commInv': 'commInv', 'v-fob': 'fob', 'v-cif': 'cif',
                'v-docArrival': 'docArrival', 'v-shipRelease': 'shipRelease', 'v-eta': 'eta', 'v-urgent-eta': 'eta', 'v-comments': 'comments'
            };

            for (let [id, key] of Object.entries(map)) {
                let el = document.getElementById(id);
                if (el && data[key] !== undefined) {
                    let sheetVal = String(data[key] || "");
                    if (el.tagName === 'SELECT' && sheetVal) {
                        let exists = Array.from(el.options).some(o => o.value === sheetVal);
                        if (!exists) {
                            el.appendChild(new Option(sheetVal + " (Legacy)", sheetVal));
                        }
                    }
                    if (forceWipe || !el.classList.contains('dirty-input')) {
                        el.value = sheetVal;
                    }
                    let isFilled = sheetVal.trim() !== "";
                    let formGroup = el.closest ? el.closest('.form-group') : el.parentElement;
                    if (formGroup) {
                        if (isFilled && !id.includes('v-urgent') && id !== 'v-comments') {
                            formGroup.style.display = 'none';
                        } else {
                            formGroup.style.display = 'block';
                        }
                    }
                }
            }
            let flexRows = document.querySelectorAll('.flex-row');
            for (let i = 0; i < flexRows.length; i++) {
                let row = flexRows[i];
                let formGroups = Array.from(row.querySelectorAll('.form-group'));
                if (formGroups.length > 0) {
                    let allHidden = formGroups.every(fg => fg.style.display === 'none');
                    row.style.display = allHidden ? 'none' : 'flex';
                }
            }
        }

        function enforcePhaseIsolation(state, isRowChange) {
            const phases = {
                "Initiated Order": { el: document.getElementById('det-req'), rank: 0 },
                "In Production": { el: document.getElementById('det-prod'), rank: 1 },
                "In Transit": { el: document.getElementById('det-transit'), rank: 2 },
                "Under Clearance": { el: document.getElementById('det-clearance'), rank: 3 }
            };

            let currentRank = phases[state] ? phases[state].rank : -1;
            for (let key in phases) {
                let phaseObj = phases[key];
                if (!phaseObj.el) continue;
                if (phaseObj.rank > currentRank) {
                    phaseObj.el.style.display = 'none';
                    continue;
                }
                const visibleGroups = Array.from(phaseObj.el.querySelectorAll('.form-group')).filter(el => el.style.display !== 'none');
                if (key === state) {
                    phaseObj.el.style.display = 'block';
                    if (isRowChange) phaseObj.el.open = true;
                    let compMsgId = 'comp-msg-' + phaseObj.rank;
                    let msgEl = document.getElementById(compMsgId);
                    if (!msgEl) {
                        msgEl = document.createElement('div');
                        msgEl.id = compMsgId;
                        msgEl.style = "text-align: center; color: var(--success); font-weight: bolder; padding: 15px; border: 1px dashed var(--success); border-radius: 8px; margin-bottom: 10px;";
                        msgEl.innerHTML = "✅ All fields for this phase are currently filled!";
                        let contentDiv = phaseObj.el.querySelector('.details-content');
                        if (contentDiv) contentDiv.appendChild(msgEl);
                    }
                    if (msgEl) {
                        msgEl.style.display = (visibleGroups.length === 0) ? 'block' : 'none';
                    }
                } else if (visibleGroups.length > 0) {
                    phaseObj.el.style.display = 'block';
                    if (isRowChange) phaseObj.el.open = false;
                } else {
                    phaseObj.el.style.display = 'none';
                }
            }
        }

        function syncBinding(targetId, val) {
            let target = document.getElementById(targetId);
            if (target) {
                target.value = val;
                target.classList.add('dirty-input');
            }
        }

        let pendingAdvanceState = false;

        function configureAdvanceButton(state) {
            const btn = document.getElementById('btn-advance');
            if (!btn) return;
            let btnConfig = {
                "Initiated Order": { label: "🚀 Advance to IN PRODUCTION", next: "In Production" },
                "In Production": { label: "🚀 Advance to IN TRANSIT", next: "In Transit" },
                "In Transit": { label: "🚀 Advance to UNDER CLEARANCE", next: "Under Clearance" },
                "Under Clearance": { label: "🚀 Advance to COMPLETED", next: "Completed" }
            };

            if (btnConfig[state]) {
                btn.innerText = btnConfig[state].label;
                pendingAdvanceState = btnConfig[state].next;
                btn.style.display = 'block';
            } else {
                pendingAdvanceState = false;
                btn.style.display = 'none';
            }
        }

        function validatePhaseAdvancement(nextState) {
            let requiredFields = [];
            if (nextState === "In Production") requiredFields = ['v-company', 'v-prNo', 'v-prDate', 'v-desc', 'v-qty', 'v-reqDelDate', 'v-buyerEmail'];
            else if (nextState === "In Transit") requiredFields = ['v-supplier', 'v-poNo', 'v-delTerm', 'v-leadTime'];
            else if (nextState === "Under Clearance") requiredFields = ['v-etd', 'v-blNo', 'v-acid', 'v-commInv'];
            else if (nextState === "Completed") requiredFields = ['v-docArrival', 'v-shipRelease'];

            let missing = [];
            for (let i = 0; i < requiredFields.length; i++) {
                let checkEl = document.getElementById(requiredFields[i]);
                if (checkEl && !checkEl.value.trim()) {
                    let label = checkEl.parentElement.querySelector('label');
                    if (label) missing.push(label.innerText);
                }
            }
            if (missing.length > 0) {
                document.getElementById('error-msg').innerText = "❌ Missing Required Data to Advance Phase: " + missing.join(", ");
                return false;
            }
            return true;
        }

        function handleAdvanceClick() {
            if (pendingAdvanceState) {
                if (!validatePhaseAdvancement(pendingAdvanceState)) return;
                submitData(pendingAdvanceState);
            }
        }

        function submitData(targetState) {
            executeSave(targetState);
        }

        async function executeSave(targetState = null) {
            currentPoNo = document.getElementById('v-poNo').value || currentPoNo;
            let currentPrNo = document.getElementById('v-prNo').value;

            if (!currentPoNo && !currentPrNo) {
                onError("Missing Identifier. Please enter a PR Number or PO Number to create a record.");
                return;
            }

            document.getElementById('loader').style.display = 'block';
            document.getElementById('error-msg').innerText = '';

            let payload = {
                poNo: currentPoNo,
                targetState: targetState || ""
            };

            const dirtyInputs = document.querySelectorAll('.dirty-input');
            dirtyInputs.forEach(el => {
                if (el.id && el.id.startsWith('v-')) {
                    let key = el.id.substring(2);
                    // Strip 'urgent-' prefix so Power Automate recognizes the mapping
                    if (key.startsWith('urgent-')) {
                        key = key.substring(7);
                    }
                    payload[key] = el.value;
                }
            });

            try {
                const res = await fetch(WRITE_FLOW_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) throw new Error("Network response was not OK");

                document.getElementById('loader').style.display = 'none';
                document.getElementById('error-msg').style.color = "var(--success)";
                document.getElementById('error-msg').innerText = "✅ Successfully Saved via Power Automate!";

                // Close dialog after 1.5 seconds if opened as a popup Window
                setTimeout(() => { if (window.opener) window.close(); }, 1500);

                // Wipe dirty state after successful save
                document.querySelectorAll('.dirty-input').forEach(el => el.classList.remove('dirty-input'));

                if (targetState) {
                    currentState = targetState;
                    renderContext({ state: targetState, poNo: currentPoNo, row: currentRow, rawObj: {} });
                }
            } catch (error) {
                onError("Flow Error: " + error.message);
            }
        }

        async function archiveOrder() {
            if (!confirm("⚠️ Are you sure you want to Archive/Cancel this order?")) return;
            // Uses standard saving logic to update state to Archived
            executeSave("Archived");
        }

        function onError(err) {
            document.getElementById('loader').style.display = 'none';
            let msg = typeof err === 'string' ? err : (err.message || 'An error occurred');
            let errorEl = document.getElementById('error-msg');
            // Changed from --danger to red hex code to ensure it renders correctly
            errorEl.style.color = "#ef4444";
            errorEl.innerText = msg;
        }
    </script>
</body>

</html>
